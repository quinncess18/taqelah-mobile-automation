name: Universal Mobile Automation (Android & iOS)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  android-test:
    name: Android (Emulator)
    runs-on: ubuntu-22.04 # CRITICAL: Bypasses the AppArmor bugs in ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Download Application Binary
        run: |
          mkdir -p apps
          curl -L "https://github.com/quinncess18/taqelah-mobile-automation/releases/download/v1.0.0/DemoApp-v1.0.0.apk" -o apps/DemoApp-v1.0.0.apk

      - name: Start Appium Server
        run: npx appium --allow-insecure adb_shell &
        env:
          APPIUM_HOME: ${{ github.workspace }}

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android Tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APPIUM_HOME: ${{ github.workspace }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install apps/DemoApp-v1.0.0.apk
            # Grant location perms to io.appium.settings — its ForegroundService
            # is declared with type=location and on API 34+ requires
            # ACCESS_*_LOCATION granted to start (else SecurityException → the
            # Appium instrumentation init fails). Grants survive the test run.
            adb shell pm grant io.appium.settings android.permission.ACCESS_FINE_LOCATION || true
            adb shell pm grant io.appium.settings android.permission.ACCESS_COARSE_LOCATION || true
            # Suppress system ANR/crash dialogs. On the resource-starved cold-boot
            # runner the Pixel Launcher ANRs and its "isn't responding / Wait /
            # Close app" dialog OVERLAYS the app, hiding the login fields — the
            # confirmed SM01 root cause + downstream cascade (run 26279266560).
            # hide_error_dialogs=1 stops the overlay suite-wide; the smoke warm-up
            # also dismisses it defensively in case it slips through.
            adb shell settings put global hide_error_dialogs 1 || true
            # DEVICE_0_SETTLE_PAUSE=2500 (bumped from 1500; default is 800ms) —
            # the CI emulator degrades over the ~90-test single-worker run, and
            # the timing-heavy modules (Gestures swipes, Form toasts, Cart
            # delete/total-sum) lag past 1500ms late in the run, producing the
            # rotating cold-render flakes (M04/T02/S03/F03) and a hard-fail when
            # one exhausts retries (S04, run 26388004233). Widen the settle
            # window suite-wide. Local tests use the default settle pause unchanged.
            CI=true DEVICE_COUNT=1 DEVICE_0_UDID=emulator-5554 DEVICE_0_NAME="Pixel 8 (Local)" DEVICE_0_PLATFORM=android DEVICE_0_SYSTEM_PORT=8200 DEVICE_0_CHROMEDRIVER_PORT=9515 DEVICE_0_SETTLE_PAUSE=2500 npm test

      - name: Upload Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-android
          path: playwright-report/
          retention-days: 30

      - name: Upload Test Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-android
          path: test-results/
          retention-days: 30

  ios-test:
    name: iOS (Simulator)
    runs-on: macos-14 # Apple Silicon; matches .app arm64 slice
    # Independent of Android job — runs in parallel, doesn't block on its result.

    env:
      IOS_SIM_NAME: "iPhone 15"
      IOS_SIM_RUNTIME: "iOS-17-5"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Install Appium XCUITest driver
        # Pin to xcuitest@7 — latest 8.x targets Appium 3.x-rc and conflicts
        # with the project's Appium 2.19 (which Android depends on).
        run: npx appium driver install --source=npm appium-xcuitest-driver@7
        env:
          APPIUM_HOME: ${{ github.workspace }}

      - name: Download iOS Application (.app.zip → .app)
        run: |
          mkdir -p apps
          curl -L "https://github.com/taqelah/demo-app/releases/download/v1.0.0/DemoApp-v1.0.0-ios.app.zip" -o apps/DemoApp-v1.0.0-ios.app.zip
          cd apps && unzip -q -o DemoApp-v1.0.0-ios.app.zip && mv Runner.app DemoApp-v1.0.0.app
          ls -la DemoApp-v1.0.0.app/ | head -5

      - name: Boot iOS Simulator
        id: boot-sim
        run: |
          # Pick a preinstalled iPhone 15 runtime on the macos-14 runner.
          # `simctl list` gives us the UDID for whichever pair we ask for.
          UDID=$(xcrun simctl list devices "${IOS_SIM_NAME}" available --json \
            | python3 -c "import sys,json; d=json.load(sys.stdin)['devices']; \
              [print(dev['udid']) for runtime,devs in d.items() if 'iOS' in runtime for dev in devs if dev['name']=='${IOS_SIM_NAME}'][:1]" \
            | head -1)
          if [ -z "$UDID" ]; then
            echo "No preinstalled ${IOS_SIM_NAME}; creating one"
            UDID=$(xcrun simctl create "${IOS_SIM_NAME}" "com.apple.CoreSimulator.SimDeviceType.iPhone-15" "com.apple.CoreSimulator.SimRuntime.${IOS_SIM_RUNTIME}")
          fi
          echo "Simulator UDID: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          # Seed a simulated GPS fix (Singapore — taqelah.sg's nominal context)
          # so the Location screen's Current Location card can render once
          # permission is granted. The Android lane injects this per-test via
          # `mobile: setGeolocation`; on iOS Simulator it's a device-level
          # setting, so set it once here at boot.
          xcrun simctl location "$UDID" set 1.2966,103.8547 || true
          echo "udid=$UDID" >> $GITHUB_OUTPUT

      - name: Pre-install app to Simulator
        run: xcrun simctl install "${{ steps.boot-sim.outputs.udid }}" apps/DemoApp-v1.0.0.app

      - name: Start Appium Server
        run: npx appium &
        env:
          APPIUM_HOME: ${{ github.workspace }}

      - name: Wait for Appium ready
        run: |
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:4723/status > /dev/null; then
              echo "Appium up"; exit 0
            fi
            sleep 1
          done
          echo "Appium did not come up"; exit 1

      - name: Run iOS Tests
        env:
          CI: "true"
          DEVICE_COUNT: "1"
          DEVICE_0_PLATFORM: "ios"
          DEVICE_0_NAME: "iPhone 15"
          DEVICE_0_UDID: ${{ steps.boot-sim.outputs.udid }}
          DEVICE_0_WDA_PORT: "8100"
          DEVICE_0_SETTLE_PAUSE: "1500"
        # Single Playwright invocation across modules — smoke leaves the app
        # on Login, §1 Auth's beforeAll inherits that state. §2 Catalog owns
        # its own state via fullResetAndLogin (terminateApp/launchApp on iOS).
        # Modules are added incrementally as iOS selectors are verified
        # (see TEST_PLAN.md → iOS Coverage Matrix).
        run: npx playwright test tests/specs/00_smoke tests/specs/01_auth tests/specs/02_catalog tests/specs/03_nav/01_main_nav.spec.js tests/specs/03_nav/02_gestures.spec.js tests/specs/03_nav/03_webview.spec.js tests/specs/03_nav/04_dialogs.spec.js tests/specs/03_nav/05_form.spec.js tests/specs/03_nav/08_tabs.spec.js tests/specs/03_nav/10_location.spec.js tests/specs/03_nav/11_dark_mode.spec.js tests/specs/04_products/01_product_detail_add.spec.js tests/specs/04_products/02_cart.spec.js tests/specs/04_products/03_checkout.spec.js tests/specs/05_regression

      - name: Upload Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-ios
          path: playwright-report/
          retention-days: 30

      - name: Upload Test Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-ios
          path: test-results/
          retention-days: 30
